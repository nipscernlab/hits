<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .blk { fill: #ffffff; stroke: #333; stroke-width: 1.6; }
      .gen { fill: #f3f6fb; stroke: #333; stroke-width: 1.2; }
      .opt { fill: #f3f6fb; stroke: #333; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .ln  { stroke: #333; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
      .lnd { stroke: #333; stroke-width: 1.2; fill: none; marker-end: url(#arr); stroke-dasharray: 5 4; }
      .t   { fill: #111; text-anchor: middle; }
      .tb  { fill: #111; text-anchor: middle; font-weight: bold; }
      .sig { fill: #1a4d8f; text-anchor: middle; font-family: Menlo, Consolas, monospace; font-size: 12px; }
      .in  { fill: #444; text-anchor: middle; font-size: 12px; }
    </style>
  </defs>

  <!-- background, so the figure reads the same in light and dark themes -->
  <rect x="0" y="0" width="980" height="330" rx="8" fill="#fafafa"/>

  <!-- random generators -->
  <rect class="gen" x="30" y="18" width="140" height="52" rx="8"/>
  <text class="t" x="100" y="40">xoshiro128**</text>
  <text class="t" x="100" y="58">XO_SEED_HIT</text>

  <rect class="gen" x="255" y="18" width="140" height="52" rx="8"/>
  <text class="t" x="325" y="40">xoshiro128**</text>
  <text class="t" x="325" y="58">XO_SEED_ENERGY</text>

  <rect class="gen" x="705" y="18" width="140" height="52" rx="8"/>
  <text class="t" x="775" y="40">xoshiro128**</text>
  <text class="t" x="775" y="58">XO_SEED_NOISE</text>

  <line class="ln"  x1="100" y1="70" x2="100" y2="118"/>
  <line class="ln"  x1="325" y1="70" x2="325" y2="118"/>
  <line class="ln"  x1="775" y1="70" x2="775" y2="118"/>

  <!-- the chain -->
  <rect class="blk" x="30" y="120" width="140" height="70" rx="10"/>
  <text class="tb" x="100" y="150">Hit draw</text>
  <text class="t"  x="100" y="170">hits/</text>

  <rect class="blk" x="255" y="120" width="140" height="70" rx="10"/>
  <text class="tb" x="325" y="150">Energy draw</text>
  <text class="t"  x="325" y="170">energy/</text>

  <rect class="blk" x="480" y="120" width="140" height="70" rx="10"/>
  <text class="tb" x="550" y="150">Pulse shaper</text>
  <text class="t"  x="550" y="170">shaper/</text>

  <rect class="blk" x="705" y="120" width="140" height="70" rx="10"/>
  <text class="tb" x="775" y="144">Noise and ADC</text>
  <text class="t"  x="775" y="164">noise/, adc/</text>
  <text class="t"  x="775" y="181" font-size="11">pedestal, round, clip</text>

  <line class="ln" x1="170" y1="155" x2="253" y2="155"/>
  <text class="sig" x="212" y="146">hits_out</text>
  <line class="ln" x1="395" y1="155" x2="478" y2="155"/>
  <text class="sig" x="437" y="146">event_bt</text>
  <line class="ln" x1="620" y1="155" x2="703" y2="155"/>
  <text class="sig" x="662" y="146">shaper_out</text>
  <line class="ln" x1="845" y1="155" x2="960" y2="155"/>
  <text class="sig" x="905" y="146">shaper_clip</text>
  <text class="in"  x="905" y="175">ADC sample</text>

  <!-- inputs and synthesis choices -->
  <line class="ln" x1="100" y1="250" x2="100" y2="192"/>
  <text class="in" x="100" y="268">occupancy (input)</text>
  <text class="in" x="100" y="285">bunch-train mask (ROM)</text>

  <line class="ln" x1="325" y1="250" x2="325" y2="192"/>
  <text class="in" x="325" y="268">energy spectrum</text>
  <text class="in" x="325" y="285">(ROM, synthesis)</text>

  <line class="ln" x1="550" y1="250" x2="550" y2="192"/>
  <text class="in" x="550" y="268">pulse shape</text>
  <text class="in" x="550" y="285">(synthesis)</text>

  <line class="ln" x1="775" y1="250" x2="775" y2="192"/>
  <text class="in" x="775" y="268">offset (input)</text>
  <text class="in" x="775" y="285">noise σ (ROM, synthesis)</text>

  <text class="in" x="490" y="318" font-size="11">one sample per clock cycle</text>
</svg>
