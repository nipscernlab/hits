# The manual (docs/) built on every pull request and every push to main, the way the
# release builds it. -W turns every Sphinx warning into an error (a broken link, a page
# outside the table of contents), so the manual cannot fall behind unnoticed.
name: manual

on:
  pull_request:
  push:
    branches: [main, 'release/**']

jobs:
  docs:
    name: manual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the manual
        run: |
          python -m pip install -r docs/requirements.txt
          python -m sphinx -W --keep-going -b html docs docs/_build/html
