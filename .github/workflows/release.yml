# Release of HITS: pushing a tag v<version> (git tag v2.0.0 && git push origin v2.0.0)
# checks the version, the regression and the manual, and only then builds the two
# archives, creates the release and publishes the manual (docs/develop/releases.md).
#
#   hits-rtl-<version>.zip   rtl/, projects/hits/ (the examples), VERSION,
#                            LICENSE, README.md
#   hits-docs-<version>.zip  the manual in HTML
#
# The manual goes to GitHub Pages, which nipscern.com/library/hits serves. Pages must be
# enabled with "GitHub Actions" as the source in the repository settings.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check:
    name: version, regression, manual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the version in VERSION
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but VERSION says $v"; exit 1; }
      - name: Install Icarus Verilog
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends iverilog
      - name: Regression (every build identical to its golden)
        run: python3 verification/regress.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the manual
        run: |
          python -m pip install -r docs/requirements.txt
          python -m sphinx -W --keep-going -b html docs docs/_build/html
          cd docs/_build && zip -qr "../../hits-docs-${GITHUB_REF_NAME#v}.zip" html
      - name: Package the RTL and the examples
        run: |
          zip -qr "hits-rtl-${GITHUB_REF_NAME#v}.zip" rtl projects/hits VERSION LICENSE README.md \
              -x 'projects/hits/quartus/db/*' 'projects/hits/quartus/incremental_db/*' \
                 'projects/hits/quartus/output_files/*' '*.vcd' '*.vvp'
      - name: Upload the site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: 'HITS ${{ github.ref_name }}'
          generate_release_notes: true
          files: |
            hits-rtl-*.zip
            hits-docs-*.zip

  pages:
    name: publish the manual
    runs-on: ubuntu-latest
    needs: check
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
