# Regressao dos goldens em todo PR e todo push na main.
# O job "regressao-golden" e o status check exigido pela protecao da main:
# nenhuma branch entra sem todos os builds bit-identicos aos goldens
# (simulador sozinho e simulador + tecnica de reconstrucao).
name: regressao

on:
  pull_request:
  push:
    branches: [main]

jobs:
  golden:
    name: regressao-golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instala o Icarus Verilog
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends iverilog
      - name: Versao do simulador
        run: iverilog -V | head -1
      - name: Regressao (todos os builds com golden)
        run: python3 verification/regress.py
